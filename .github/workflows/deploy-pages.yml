name: Build and deploy user guides

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "styles/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build user guides
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output directory
        run: |
          mkdir -p _site/styles

      - name: Copy shared styles
        run: |
          cp -r styles/. _site/styles/

      - name: Copy application assets
        run: |
          for app_dir in apps/*; do
            if [ ! -d "$app_dir" ]; then
              continue
            fi

            app_id=$(basename "$app_dir")
            target_dir="_site/apps/$app_id"

            echo "Preparing application: $app_id"
            mkdir -p "$target_dir"

            if [ -d "$app_dir/images" ]; then
              cp -r "$app_dir/images" "$target_dir/images"
            fi
          done

      - name: Convert Markdown guides to HTML
        run: |
          while IFS= read -r input; do
            language_dir=$(dirname "$input")
            language=$(basename "$language_dir")
            app_dir=$(dirname "$language_dir")
            app_id=$(basename "$app_dir")

            output_dir="_site/apps/$app_id/$language"
            output_file="$output_dir/index.html"

            echo "Building $app_id ($language)"
            mkdir -p "$output_dir"

            docker run --rm \
              --volume "$PWD:/data" \
              --workdir /data \
              pandoc/core:3.8 \
              --from=gfm \
              --to=html5 \
              --standalone \
              --section-divs \
              --toc \
              --toc-depth=3 \
              --css=../../../styles/userguide.css \
              --output="$output_file" \
              "$input"
          done < <(
            find apps \
              -mindepth 3 \
              -maxdepth 3 \
              -type f \
              -name index.md \
              -print \
              | sort
          )

      - name: Validate generated guides
        run: |
          guide_count=$(
            find _site/apps \
              -type f \
              -name index.html \
              | wc -l
          )

          echo "Generated HTML guides: $guide_count"

          if [ "$guide_count" -eq 0 ]; then
            echo "::error::No user guides were generated."
            exit 1
          fi

      - name: Generate portal front page
        run: |
          python3 scripts/build_portal.py

      - name: Validate portal front page
        run: |
          test -f _site/index.html || {
            echo "::error::Portal front page was not generated."
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
