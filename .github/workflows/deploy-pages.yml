name: Build and deploy user guides

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "styles/**"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build user guides
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output structure
        run: |
          mkdir -p _site/apps/electroauthorizationsystem
          mkdir -p _site/styles

      - name: Copy styles
        run: |
          cp -r styles/. _site/styles/

      - name: Copy images
        run: |
          cp -r \
            apps/electroauthorizationsystem/images \
            _site/apps/electroauthorizationsystem/images

      - name: Convert Markdown to HTML
        uses: docker://pandoc/core:3.8
        with:
          args: >-
            --from=gfm
            --to=html5
            --standalone
            --metadata
            title="Electro Authorization System"
            --css=../../styles/userguide.css
            --output=_site/apps/electroauthorizationsystem/index.html
            apps/electroauthorizationsystem/index.md

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
