name: Build and deploy user guides

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "styles/**"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build user guides
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output directory
        run: |
          mkdir -p _site
          mkdir -p _site/styles

      - name: Copy shared styles
        run: |
          cp -r styles/. _site/styles/

      - name: Prepare application files
        run: |
          for app_dir in apps/*; do
            if [ ! -d "$app_dir" ]; then
              continue
            fi

            app_name=$(basename "$app_dir")

            if [ ! -f "$app_dir/index.md" ]; then
              echo "Skipping $app_name: no index.md found"
              continue
            fi

            echo "Preparing $app_name"

            mkdir -p "_site/apps/$app_name"

            cp -r "$app_dir"/. "_site/apps/$app_name/"

            rm "_site/apps/$app_name/index.md"
          done

      - name: Convert Markdown guides to HTML
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            pandoc/core:3.8 \
            sh -c '
              for input in apps/*/index.md; do
                [ -f "$input" ] || continue

                app_dir=$(dirname "$input")
                app_name=$(basename "$app_dir")

                echo "Building $app_name"

                pandoc \
                  --from=gfm \
                  --to=html5 \
                  --standalone \
                  --css=../../styles/userguide.css \
                  --output="_site/apps/$app_name/index.html" \
                  "$input"
              done
            '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
